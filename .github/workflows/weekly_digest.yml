name: Weekly Email Digest

on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly digest
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}
          GMAIL_READER_CLIENT_ID: ${{ secrets.GMAIL_READER_CLIENT_ID }}
          GMAIL_READER_CLIENT_SECRET: ${{ secrets.GMAIL_READER_CLIENT_SECRET }}
          GMAIL_READER_REFRESH_TOKEN: ${{ secrets.GMAIL_READER_REFRESH_TOKEN }}
          GMAIL_READER_ADDRESS: ${{ secrets.GMAIL_READER_ADDRESS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_COMPANIES_DB_ID: ${{ secrets.NOTION_COMPANIES_DB_ID }}
          NOTION_CONTACTS_DB_ID: ${{ secrets.NOTION_CONTACTS_DB_ID }}
          NOTION_OPPORTUNITIES_DB_ID: ${{ secrets.NOTION_OPPORTUNITIES_DB_ID }}
          NOTION_DIGEST_ARCHIVE_DB_ID: ${{ secrets.NOTION_DIGEST_ARCHIVE_DB_ID }}
          DIGEST_RECIPIENT_EMAIL: ${{ secrets.DIGEST_RECIPIENT_EMAIL }}
          DIGEST_TEAM_NAME: ${{ secrets.DIGEST_TEAM_NAME }}
        run: python src/main.py
